[project]
name = "support-knowledge-ingestion"
version = "0.1.0"
description = "Knowledge base preparation and ingestion service"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.34",
  "fastapi>=0.115",
  "pydantic-settings>=2.4",
  "pymupdf>=1.24",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8.3", "pytest-cov>=5.0", "moto[s3,sqs,dynamodb]>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
